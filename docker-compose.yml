services:
  api1: &api
    image: passosmatheus/sub-rinha-2026:knn-int8
    environment:
      SOCKET_PATH: /sockets/api1.sock
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "125M"

  api2:
    <<: *api
    environment:
      SOCKET_PATH: /sockets/api2.sock

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "100M"

volumes:
  sockets:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,mode=0777"
