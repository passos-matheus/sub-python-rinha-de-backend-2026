services:
  api1: &api
    image: passosmatheus/sub-rinha-2026:rf
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "100M"

  api2:
    <<: *api

  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "100M"
