worker_processes 1;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    access_log off;
    error_log /dev/null crit;

    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 10000;

    upstream api {
        server api1:3000;
        server api2:3000;
        keepalive 64;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
